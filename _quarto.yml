project:
  type: website
  output-dir: _site

website:
  title: "Alejandro Ascárate"
  site-url: "https://aleazk.github.io"
  description: "Research in mathematical physics and artificial intelligence."
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    left:
      - text: Research
        href: research/index.qmd
      - text: Publications
        href: publications.qmd
      - text: Software
        href: software.qmd
      - text: About
        href: about.qmd
      - text: More
        menu:
          - text: Mathematical Physics Notes
            href: more/notes.qmd         
          - text: Book-drafts & Extended Writing
            href: more/books.qmd             
          - text: Earlier Work
            href: more/archive.qmd  
          - text: Music & Visual Art
            href: more/music-art.qmd            
    right:
      - icon: github
        href: https://github.com/aleazk
        aria-label: GitHub
      - text: arXiv
        href: https://arxiv.org/search/?query=Alejandro+Ascarate&searchtype=author
  page-footer:
    left: "© Alejandro Ascárate"
    right: "Mathematical Physics · Artificial Intelligence"

format:
  html:
    theme:
      - litera
      - styles.scss
    toc: false
    smooth-scroll: true
    anchor-sections: false
    code-copy: true
    include-after-body: includes/after-body.html

execute:
  freeze: auto
