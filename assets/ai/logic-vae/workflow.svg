<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
<title id="title">Conditional Logic VAE and probability predictor</title>
<desc id="desc">A tree with topology, operators, and concept identifiers enters the encoder. Leaf probabilities condition the encoder and decoder. The latent representation branches to the tree decoder and a separate internal-node probability predictor. Internal-node probabilities are prediction targets, not encoder inputs.</desc>
