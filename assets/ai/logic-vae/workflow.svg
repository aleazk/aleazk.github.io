<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#1c2528">
<text x="490" y="42" font-size="18">Leaf probabilities</text><text x="490" y="63" font-size="15">condition c</text>
<text x="104" y="128" font-size="21">Labelled tree T</text><text x="104" y="154" font-size="16">Topology + operators</text><text x="104" y="177" font-size="16">+ concept identifiers</text>
<text x="296" y="162" font-size="18">Encoder</text><text x="490" y="152" font-size="21">Latent z</text><text x="490" y="176" font-size="15">512 dimensions</text>
<text x="683" y="162" font-size="18">Decoder</text>
<text x="934" y="148" font-size="21">Generated tree</text><text x="934" y="175" font-size="16">Topology + node labels</text>
<text x="680" y="291" font-size="18">Probability</text><text x="680" y="314" font-size="18">predictor</text>
<text x="934" y="288" font-size="21">Internal-node</text><text x="934" y="315" font-size="21">probabilities</text>
<text x="540" y="372" font-size="16" fill="#285a61">Internal-node probabilities supervise the predictor; they are not encoder inputs.</text>
